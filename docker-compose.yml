services:
  mysqldb:
    image: mysql:8.0
    container_name: muebles_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASS:-root123}
      MYSQL_DATABASE: muebleshermanos
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - muebles_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: muebles_backend
    restart: always
    ports:
      - "8081:1544"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/muebleshermanos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASS:-root123}
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - muebles_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: muebles_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - muebles_net

networks:
  muebles_net:
    driver: bridge

volumes:
  mysql_data: